name: Verificacion C++17

on:
  push:
  pull_request:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Compilar con g++ C++17
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic src/main.cpp src/fb_bruteforce.cpp -o build/ada_p1
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Isrc tests/test_runner.cpp src/fb_bruteforce.cpp -o build/test_runner
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic tests/verificar_semilla.cpp -o build/verificar_semilla

      - name: Verificar semilla
        run: ./build/verificar_semilla

      - name: Ejecutar pruebas FB y diccionario
        run: ./build/test_runner resources/diccionario.txt

      - name: Probar CLI de comparacion
        run: |
          hash=$(./build/ada_p1 hash 3cab)
          ./build/ada_p1 comparar "$hash" abc123 4 4 resources/diccionario.txt
